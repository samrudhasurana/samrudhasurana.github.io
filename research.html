<body data-theme="light" data-color="sage" class="font-palatino">
    <script>
    // Apply the saved (or system-preferred) theme before content paints to avoid a flash.
    (function() {
        var saved = localStorage.getItem('preferredTheme');
        if (!saved) {
            saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.body.setAttribute('data-theme', saved);
    })();
    </script>
    <div class="controls-bar">

                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>

            </button>
        </div>

    <main class="main-container">

        <div id="research-content">

                <p class="footer-email">ssurana [at] gmu [dot] edu</p>
                <div class="footer-social">
                    <a href="https://www.linkedin.com/in/samrudha-surana/" target="_blank" aria-label="LinkedIn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
                            <rect x="2" y="9" width="4" height="12"></rect>
                            <circle cx="4" cy="4" r="2"></circle>
                        </svg>
                    </a>
                    <a href="https://x.com/samrudha_surana" target="_blank" aria-label="Twitter/X">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

    <!-- Conferences Floating Tab -->
    <button id="conferences-float-btn" class="conferences-float-btn" onclick="openConferencesPanel()" aria-label="Conferences I'll be at — open panel" hidden>
        Conferences I'll be at
    </button>

    <!-- Conferences Side Panel -->
    <div id="conferences-overlay" class="side-panel-overlay" onclick="closeConferencesPanel()"></div>
    <aside id="conferences-side-panel" class="side-panel" role="dialog" aria-modal="true" aria-label="Conferences">
        <div class="side-panel-header">
            <span class="side-panel-title">Conferences</span>
            <button class="side-panel-close" onclick="closeConferencesPanel()" aria-label="Close">&times;</button>
        </div>
        <div class="side-panel-body">
            <div class="conferences-list" id="conferences-panel-list"></div>
        </div>
    </aside>

    <script>
    function toggleTheme() {
        const body = document.body;
        const currentTheme = body.getAttribute('data-theme');
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        body.setAttribute('data-theme', newTheme);
        localStorage.setItem('preferredTheme', newTheme);
        updateThemeIcon(newTheme);
    }

    function updateThemeIcon(theme) {
        const sunIcon = document.getElementById('theme-icon-sun');
        const moonIcon = document.getElementById('theme-icon-moon');
        const label = document.getElementById('theme-label');
        if (theme === 'dark') {
            sunIcon.style.display = 'none';
            moonIcon.style.display = 'block';
            label.textContent = 'Light';
        } else {
            sunIcon.style.display = 'block';
            moonIcon.style.display = 'none';
            label.textContent = 'Dark';
        }
    }

    // Sync the toggle icon with the theme already applied by the early inline script,
    // and stamp the current year in the footer.
    document.addEventListener('DOMContentLoaded', function() {
        updateThemeIcon(document.body.getAttribute('data-theme') || 'light');
        document.querySelectorAll('.cr-year').forEach(function(el) {
            el.textContent = new Date().getFullYear();
        });
    });

    function formatDate(dateStr) {
        if (!dateStr) return '';
        // Handle YYYY-MM format
        const parts = dateStr.split('-');
        if (parts.length === 2) {
            const date = new Date(parts[0], parseInt(parts[1]) - 1, 1);
            return date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
        }
        return dateStr;
    }

    // Load research data from JSON file
    fetch('research-data.json')
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById('research-content');
            let html = '';

            // Shared renderer: one bulleted entry per item
            function renderItem(item, key) {
                const title = item.url
                    ? `<a href="${item.url}" target="_blank">${item.title}</a>`
                    : item.title;
                const meta = [item.authors, item.venue, item.date ? formatDate(item.date) : '']
                    .filter(Boolean).join(' &middot; ');
                let note = '';
                if (item.note) {
                    note = typeof item.note === 'string' ? item.note
                        : (item.note.link
                            ? item.note.text.replace(item.note.link.text, `<a href="${item.note.link.url}" target="_blank">${item.note.link.text}</a>`)
                            : item.note.text);
                }
                const links = [];
                if (item.pdfUrl) links.push(`<a href="${item.pdfUrl}" target="_blank">PDF</a>`);
                if (item.abstract) links.push(`<button type="button" class="abstract-toggle" aria-expanded="false" onclick="toggleAbstract('${key}', this)">Abstract <span class="caret">&#9656;</span></button>`);
                return `
                    <li class="pub-item">
                        <span class="pub-title">${title}</span>
                        ${meta ? `<div class="pub-meta">${meta}</div>` : ''}
                        ${note ? `<div class="pub-note">${note}</div>` : ''}
                        ${links.length ? `<div class="pub-links">${links.join('<span class="pub-sep">&middot;</span>')}</div>` : ''}
                        ${item.abstract ? `<div id="${key}" class="abstract-content" hidden><p>${item.abstract}</p></div>` : ''}
                    </li>
                `;
            }

            function renderSection(title, items, prefix) {
                if (!items || items.length === 0) return '';
                let out = `<section class="research-section"><h2 class="section-title">${title}</h2><ul class="pub-list">`;
                items.forEach((item, i) => { out += renderItem(item, `${prefix}-abstract-${i}`); });
                return out + '</ul></section>';
            }

            html += renderSection('Journal Articles', data.journalArticles, 'journal');
            html += renderSection('Policy Paper', data.policyPapers, 'policy');
            html += renderSection('Book Review', data.bookReviews, 'review');
            html += renderSection('Working Paper', data.workingPapers, 'working');
            html += renderSection('Works in Progress', data.worksInProgress, 'wip');

            // Conferences
            if (data.conferences && data.conferences.length > 0) {
                // Show the floating tab now that we know there are conferences
                document.getElementById('conferences-float-btn').hidden = false;

                // Split into upcoming vs past using endDate (YYYY-MM-DD)
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const upcoming = data.conferences
                    .filter(c => c.endDate && new Date(c.endDate) >= today)
                    .sort((a, b) => new Date(a.endDate) - new Date(b.endDate));
                const past = data.conferences
                    .filter(c => !c.endDate || new Date(c.endDate) < today)
                    .sort((a, b) => new Date(b.endDate || 0) - new Date(a.endDate || 0));

                function buildConfCard(conf) {
                    const confDate = conf.date || conf.dates || '';
                    let html = `
                        <div class="conference-item">
                            <div class="conference-main">
                                <span class="conference-name">${conf.name}</span>
                                ${conf.role ? `<span class="conference-role">${conf.role}</span>` : ''}
                            </div>
                            <div class="conference-meta">
                                ${conf.location ? `<span class="conference-location">${conf.location}</span>` : ''}
                                ${conf.location && confDate ? `<span class="conference-sep">&middot;</span>` : ''}
                                ${confDate ? `<span class="conference-date">${confDate}</span>` : ''}
                            </div>
                    `;
                    if (conf.presentations && conf.presentations.length > 0) {
                        html += `<div class="conf-presentations">`;
                        conf.presentations.forEach(p => {
                            html += `
                                <div class="conf-pres-item">
                                    <div class="conf-pres-title">${p.title || ''}${p.coauthors ? `<span class="conf-pres-coauthors"> ${p.coauthors}</span>` : ''}</div>
                                    ${p.session ? `<div class="conf-pres-session">${p.session}</div>` : ''}
                                    ${(p.sessionDate || p.sessionTime) ? `<div class="conf-pres-time">${[p.sessionDate, p.sessionTime].filter(Boolean).join(', ')}</div>` : ''}
                                </div>
                            `;
                        });
                        html += `</div>`;
                    }
                    html += `</div>`;
                    return html;
                }

                // Populate the side panel
                const panelList = document.getElementById('conferences-panel-list');
                if (panelList) {
                    let panelHtml = '';
                    if (upcoming.length > 0) {
                        panelHtml += `<h3 class="panel-section-heading">Upcoming</h3><div class="conferences-list">`;
                        upcoming.forEach(c => { panelHtml += buildConfCard(c); });
                        panelHtml += `</div>`;
                    }
                    if (past.length > 0) {
                        const PAST_LIMIT = 3;
                        panelHtml += `<h3 class="panel-section-heading">Previously at</h3><div class="conferences-list">`;
                        past.slice(0, PAST_LIMIT).forEach(c => { panelHtml += buildConfCard(c); });
                        panelHtml += `</div>`;
                        if (past.length > PAST_LIMIT) {
                            panelHtml += `<div id="past-overflow" style="display:none;"><div class="conferences-list">`;
                            past.slice(PAST_LIMIT).forEach(c => { panelHtml += buildConfCard(c); });
                            panelHtml += `</div></div>`;
                            panelHtml += `<button class="btn-show-previous" onclick="document.getElementById('past-overflow').style.display='block';this.style.display='none';">Show previous</button>`;
                        }
                    }
                    panelList.innerHTML = panelHtml;
                }
            }

            html += renderSection('Popular Articles', data.popularArticles, 'popular');

            container.innerHTML = html;
        })
        .catch(error => {
            console.error('Error loading research data:', error);
            document.getElementById('research-content').innerHTML = '<p>Error loading research data. Please try again later.</p>';
        });
    
    function openConferencesPanel() {
        document.getElementById('conferences-side-panel').classList.add('is-open');
        document.getElementById('conferences-overlay').classList.add('is-open');
        document.body.style.overflow = 'hidden';
    }

    function closeConferencesPanel() {
        document.getElementById('conferences-side-panel').classList.remove('is-open');
        document.getElementById('conferences-overlay').classList.remove('is-open');
        document.body.style.overflow = '';
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeConferencesPanel();
    });

    function toggleAbstract(id, button) {
        const abstract = document.getElementById(id);
        const open = abstract.hidden;
        abstract.hidden = !open;
        button.setAttribute('aria-expanded', String(open));
        button.querySelector('.caret').innerHTML = open ? '&#9662;' : '&#9656;';
    }
    </script>
</body>
